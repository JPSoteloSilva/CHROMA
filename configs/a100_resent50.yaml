seed_everything: 42

model:
  num_classes: 2
  backbone_name: resnet50
  pretrained: true
  train_layers: null  # Train all backbone/head layers
  # train_layers:
  #   first_n: 10
  #   last_n: 5
  lr_groups:
    backbone_lr_mult: 0.5
    head_lr_mult: 1.0
  log_score_histograms: true
  heldout_csv_path: chroma_scores_resnet50
  heldout_meta_csv_path: /scratch/data/test_set.csv
  feature_composer:
    include_rgb: true
    rgb_standardize: imagenet
    pipelines:
      - name: rgb_corr
        transforms:
          - type: inter_channel_correlation
            window: 7
            stride: 1
      - name: lab_corr
        transforms:
          - type: rgb_to_lab
          - type: inter_channel_correlation
            window: 7
            stride: 1
  optimizer:
    init_args:
      lr: 3.0e-4
      weight_decay: 0.01
  scheduler:
    init_args:
      mode: max
      factor: 0.5
      patience: 3
    monitor: val/auroc
  class_weights: null

data:
  # Training dataset - Multiple real and generated sources
  train_real_paths:
    - /scratch/data/laion_art/train
    - /scratch/data/ffhq/train
    - /scratch/data/imagenet/train
  train_gen_paths:
    - /scratch/data/synthbuster/glide/train
    - /scratch/data/synthbuster/stable-diffusion-1-3/train
    - /scratch/data/synthbuster/stable-diffusion-1-4/train
    - /scratch/data/synthbuster/stable-diffusion-2/train
    - /scratch/data/synthbuster/stable-diffusion-xl/train
    - /scratch/data/train_set
    - /scratch/data/stylegan2_ffhq
    - /scratch/data/test_set/dalle_2
    - /scratch/data/test_set/dalle3_cocoval
  
  # Validation dataset
  val_real_paths:
    - /scratch/data/laion_art/val
    - /scratch/data/ffhq/val
    - /scratch/data/imagenet/val
  val_gen_paths:
    - /scratch/data/synthbuster/glide/val
    - /scratch/data/synthbuster/stable-diffusion-1-3/val
    - /scratch/data/synthbuster/stable-diffusion-1-4/val
    - /scratch/data/synthbuster/stable-diffusion-2/val
    - /scratch/data/synthbuster/stable-diffusion-xl/val
  
  # Heldout split (second validation dataloader during fit)
  heldout_real_paths:
    - /scratch/data/test_set/real_coco_valid
    - /scratch/data/test_set/real_ffhq
    - /scratch/data/test_set/real_imagenet_val
    - /scratch/data/test_set/real_lsun
  heldout_gen_paths:
    - /scratch/data/test_set/biggan_256
    - /scratch/data/test_set/biggan_512
    - /scratch/data/test_set/DDPM
    - /scratch/data/test_set/Deepfloyd-IF_Stage_III
    - /scratch/data/test_set/DiffusionProjectedGan_lsunbed_256
    - /scratch/data/test_set/DiffusionProjectedGan_lsunchurch_256
    - /scratch/data/test_set/DiT_256
    - /scratch/data/test_set/DiT_512
    - /scratch/data/test_set/galip_cocoval
    - /scratch/data/test_set/gaugan
    - /scratch/data/test_set/GigaGAN_cond_imagenet256
    - /scratch/data/test_set/GigaGAN_t2i_coco256_diff_noised
    - /scratch/data/test_set/GigaGAN_t2i_coco256_rep
    - /scratch/data/test_set/glide_text2img_valid
    - /scratch/data/test_set/guided-diffusion_class2image_ImageNet
    - /scratch/data/test_set/guided-diffusion_noise2image_LSUNbedrooms
    - /scratch/data/test_set/guided-diffusion_noise2image_LSUNcats
    - /scratch/data/test_set/guided-diffusion_noise2image_LSUNhorses
    - /scratch/data/test_set/latent-diffusion_class2image_ImageNet
    - /scratch/data/test_set/latent-diffusion_noise2image_FFHQ
    - /scratch/data/test_set/latent-diffusion_noise2image_LSUNbedrooms
    - /scratch/data/test_set/latent-diffusion_noise2image_LSUNchurches
    - /scratch/data/test_set/latent-diffusion_text2img_valid
    - /scratch/data/test_set/progan_lsun
    - /scratch/data/test_set/sdxl_cocoval
    - /scratch/data/test_set/stable_diffusion_2_1_256
    - /scratch/data/test_set/stable_diffusion_2_1_512
    - /scratch/data/test_set/stable_diffusion_2_1_768
    - /scratch/data/test_set/stable_diffusion_256
    - /scratch/data/test_set/stargan
    - /scratch/data/test_set/stylegan2_church
    - /scratch/data/test_set/stylegan2_ffhq_1024x1024
    - /scratch/data/test_set/stylegan2_ffhq_256x256
    - /scratch/data/test_set/stylegan2_lsundog_256x256
    - /scratch/data/test_set/stylegan3_r
    - /scratch/data/test_set/stylegan3_t
  
  # A100 optimized settings
  batch_size: 700
  num_workers: 4
  prefetch_factor: 2
  drop_last: true
  use_weighted_sampler: true
  crop_size: 224
  pad_mode: reflect
  augment:
    random_hflip_p: 0.5
    random_rotation_degrees: null
    # color_jitter: null  # Can enable: {brightness: 0.2, contrast: 0.2, saturation: 0.2}
    # jpeg:
    #   quality_min: 70
    #   quality_max: 100
    #   probability: 0.5
    # blur:
    #   kernel_size: 5
    #   sigma: 1.0
    #   probability: 0.2
    # resize:
    #   scale_min: 0.70  # Minimum scale factor (0 < scale_min <= 1.0)
    #   scale_max: 0.95  # Maximum scale factor (scale_min <= scale_max <= 1.0)
    #   probability: 0.3  # Probability of applying resize augmentation (0.0-1.0)
    #   interpolation: bilinear  # Resize interpolation: bilinear, nearest, bicubic, lanczos
  sampling_strategy: source  # none | class | source | class_source

trainer:
  max_epochs: 100
  precision: 16-mixed  # A100 has excellent mixed precision support
  accelerator: gpu
  devices: 1
  log_every_n_steps: 100
  limit_train_batches: null
  limit_val_batches: null
  overfit_batches: 0
  callbacks:
    - type: ModelCheckpoint
      init_args:
        monitor: val/auroc
        mode: max
        save_top_k: 3  # Keep top 3 checkpoints
        save_last: true  # Also save last checkpoint
        filename: "epoch={epoch:02d}-auroc={val/auroc:.4f}"
        auto_insert_metric_name: false
    - type: LearningRateMonitor
      init_args:
        logging_interval: step
  logger:
    type: wandb
    init_args:
      project: "chroma-deepfake-detection"
      name: null  # auto-generated run name
      save_dir: "wandb_logs"
      offline: false
      tags:
        - "a100"
        - "production"
        - "resnet50"
        - "rgb,rgb_corr,lab_corr"
        - "first_n=null,last_n=null"
        - "train_set,synthbuster"
        - "source"


