[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chroma"
version = "0.1.0"
description = "CHROMA: Detecting AI-Generated Images through Inter-Channel Color-Space Correlations"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Juan Pablo Sotelo", email = "juan.pablo.sotelo.silva@fing.edu.uy" },
]
dependencies = [
  "lightning>=2.2.0",
  "torch>=2.3.0",
  "torchvision>=0.18.0",
  "torchmetrics>=1.3.0",
  "timm>=0.9.0",
  "kornia>=0.7.0",
  "pillow>=10.0.0",
  "numpy>=1.26.0,<2.0.0",
  "matplotlib>=3.8.0,<3.10.0",
  "contourpy>=1.0.0,<1.3.0",
  "scipy>=1.16.3",
  "pydantic>=2.5.0",
  "pyyaml>=6.0.0",
  "wandb>=0.16.0",
  "loguru>=0.7.3",
  "types-pyyaml>=6.0.12.20250915",
]

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "pre-commit>=4.2.0",
    "ruff>=0.11.13",
    "mypy>=1.16.0",
    "hatchling>=1.27.0",
    "pytest>=8.3.0",
]

local = [
    "ipykernel>=7.1.0",
]

[tool.uv]
default-groups = ["dev"]

# Platform-specific PyTorch indexes
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

# Platform-specific PyTorch sources
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
]

[tool.hatch.build.targets.wheel]
packages = [
  "src/chroma/",
]

[tool.hatch.build.targets.sdist]
include = [
  "src/chroma",
  "README.md",
  "pyproject.toml",
]


[tool.ruff]
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
]

line-length = 100
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["F", "I", "E", "W", "ARG", "T201"]
fixable = ["I"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E712", "ARG001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
ignore_missing_imports = true
show_error_codes = true
disallow_untyped_defs = false
check_untyped_defs = false


[[tool.mypy.overrides]]
module = ["torch.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
